<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <title>聯絡我們 | NovaStudio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Bootstrap 5 RWD 全站示範專案">
    
<link rel="stylesheet" href="/bootstrap5-fullsite-eleventy/assets/css/main.css">
  </head>
  

  <body class="page page--contact">
    <header class="site-header">
      <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm site-header__nav">
        <div class="container">
          <a class="navbar-brand site-header__brand" href="/">NovaStudio</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto site-header__menu">
              
              <li class="nav-item site-header__menu-item">
<a
  class="nav-link site-header__menu-link"
  href="/bootstrap5-fullsite-eleventy/"
>
  首頁
</a>

              </li>
              
              <li class="nav-item site-header__menu-item">
<a
  class="nav-link site-header__menu-link"
  href="/bootstrap5-fullsite-eleventy/services/"
>
  服務項目
</a>

              </li>
              
              <li class="nav-item site-header__menu-item">
<a
  class="nav-link site-header__menu-link"
  href="/bootstrap5-fullsite-eleventy/about/"
>
  關於我們
</a>

              </li>
              
              <li class="nav-item site-header__menu-item">
<a
  class="nav-link site-header__menu-link site-header__menu-link--active"
  href="/bootstrap5-fullsite-eleventy/contact/"
>
  聯絡我們
</a>

              </li>
              
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="site-main">
      

<div class="row">
  <div class="col-lg-7">
    <form class="contact-form">
      <div class="mb-3 contact-form__group">
        <label for="name" class="form-label contact-form__label">姓名</label>
        <input type="text" class="form-control contact-form__input" id="name" placeholder="請輸入您的姓名">
      </div>
      <div class="mb-3 contact-form__group">
        <label for="email" class="form-label contact-form__label">Email</label>
        <input type="email" class="form-control contact-form__input" id="email" placeholder="example@email.com">
      </div>
      <div class="mb-3 contact-form__group">
        <label for="message" class="form-label contact-form__label">留言內容</label>
        <textarea class="form-control contact-form__textarea" id="message" rows="4" placeholder="請輸入您的需求或問題"></textarea>
      </div>
      <button type="submit" class="btn btn-primary contact-form__submit">送出訊息</button>
    </form>
  </div>
  <div class="col-lg-5">
    <div class="contact-info">
      <h2 class="contact-info__title">作品展示說明建議寫法</h2>
      <p class="contact-info__text">
        「前端僅示範表單切版與 UI 互動，尚未串接後端。實務專案可改為對接 Laravel / Spring Boot / Node.js API。」<br>
        這樣在案主那邊會很清楚你現在展示的是切版能力，而不是完整系統。
      </p>
    </div>
  </div>
</div>

    </main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__text mb-0">© 2025 NovaStudio. All rights reserved.</p>
  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="/bootstrap5-fullsite-eleventy/assets/js/main.js" defer></script>
  </body>
</html>
